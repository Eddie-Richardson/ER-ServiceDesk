# ER-ServiceDesk/docker-compose.yml
# Docker Compose setup for API, Postgres, Redis, and RQ worker

version: "3.9"

services:
  api:
    build: .
    container_name: er_api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: er_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erservicedesk
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: er_redis

  worker:
    build: .
    container_name: er_worker
    command: ["python", "app/workers/worker.py"]
    env_file: .env
    depends_on:
      - redis
      - api

volumes:
  postgres-data:
