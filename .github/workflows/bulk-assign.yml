name: Bulk Assign Milestones

on:
  workflow_dispatch:

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Assign milestones to all issues
        uses: actions/github-script@v6
        with:
          script: |
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100
              }
            );

            function pickMilestone(labels) {
              const names = labels.map(l => l.name);

              if (names.includes("devex")) return "Developer Experience";
              if (names.includes("testing")) return "Testing & QA";
              if (names.includes("frontend") || names.includes("ui") || names.includes("logic"))
                return "Frontend";
              if (names.includes("backend") || names.includes("api") || names.includes("database") || names.includes("worker"))
                return "Backend";
              if (names.includes("devops") || names.includes("infrastructure") || names.includes("ci/cd") || names.includes("security") || names.includes("logging") || names.includes("errors"))
                return "Infrastructure & DevOps";

              return null;
            }

            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            for (const issue of issues) {
              const milestoneName = pickMilestone(issue.labels);
              if (!milestoneName) continue;

              const milestone = milestones.data.find(m => m.title === milestoneName);
              if (!milestone) continue;

              if (!issue.milestone) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  milestone: milestone.number
                });
              }
            }
